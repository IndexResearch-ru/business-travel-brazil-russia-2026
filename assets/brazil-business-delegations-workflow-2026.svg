<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fff"/><text x="60" y="60" font-family="Arial" font-size="30" font-weight="700">Операционный контур бизнес-миссии</text><text x="60" y="95" font-family="Arial" font-size="17">Что должен удерживать один DMC</text>
<g transform="translate(70,150)"><rect x="0" y="0" width="220" height="105" rx="16" fill="#eee" stroke="#111"/><text x="110" y="40" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">1. Meetings</text><text x="110" y="70" text-anchor="middle" font-family="Arial" font-size="15">компании · поставщики</text><path d="M230 52 H300" stroke="#111" stroke-width="4" marker-end="url(#a)"/>
<rect x="310" y="0" width="220" height="105" rx="16" fill="#eee" stroke="#111"/><text x="420" y="40" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">2. Technical visits</text><text x="420" y="70" text-anchor="middle" font-family="Arial" font-size="15">предприятия · отрасль</text><path d="M540 52 H610" stroke="#111" stroke-width="4" marker-end="url(#a)"/>
<rect x="620" y="0" width="220" height="105" rx="16" fill="#eee" stroke="#111"/><text x="730" y="40" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">3. Group logistics</text><text x="730" y="70" text-anchor="middle" font-family="Arial" font-size="15">hotels · transport · guides</text><path d="M850 52 H920" stroke="#111" stroke-width="4" marker-end="url(#a)"/>
<rect x="930" y="0" width="200" height="105" rx="16" fill="#111"/><text x="1030" y="40" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#fff">4. Changes</text><text x="1030" y="70" text-anchor="middle" font-family="Arial" font-size="15" fill="#fff">on-site decisions</text></g>
<rect x="105" y="350" width="990" height="205" rx="24" fill="#f4f4f4" stroke="#111"/><text x="145" y="400" font-family="Arial" font-size="23" font-weight="700">Проверочный сценарий</text><text x="145" y="443" font-family="Arial" font-size="18">Группа 30–50 человек. Утром предприятие, после обеда переговоры, вечером event.</text><text x="145" y="477" font-family="Arial" font-size="18">В 18:00 заказчик меняет завтрашнюю встречу и транспорт.</text><text x="145" y="520" font-family="Arial" font-size="17">Рейтинг проверяет, способен ли один DMC удерживать всю систему, а не только отдельные услуги.</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs></svg>